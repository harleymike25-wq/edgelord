# Netlify runs Next.js through the OpenNext adapter, which it installs and
# configures automatically -- build command and publish directory are detected,
# so they are deliberately not pinned here.
#
# The dashboard reads Firestore server-side via firebase-admin, so the only
# required setting is FIREBASE_SERVICE_ACCOUNT in the Netlify UI
# (Site configuration > Environment variables). Set it to the *contents* of the
# service account JSON on one line, not a file path.
#
# Without that variable the site falls back to reading public/data/*.json from
# the function bundle. That file is gitignored, so on Netlify the fallback
# yields an empty dashboard rather than stale data -- which is the intended
# failure mode: better blank than silently out of date.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

  # The Python bot is not part of this deploy -- Netlify builds only the
  # dashboard at the repository root. bot/ is excluded from secret scanning
  # because its .env.example documents key names, and a scanner matching on
  # names or prefixes flags documentation as a leak.
  SECRETS_SCAN_OMIT_PATHS = "bot/**,README.md,VERIFIED.md"

  # The dashboard reads Firestore and nothing else. It never calls Anthropic,
  # so ANTHROPIC_API_KEY must not be set in Netlify at all -- if it is, the
  # scanner will hunt for that value across the repo and build output.
  SECRETS_SCAN_OMIT_KEYS = "ANTHROPIC_API_KEY,ODDS_API_KEY,FIREBASE_CREDENTIALS"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
